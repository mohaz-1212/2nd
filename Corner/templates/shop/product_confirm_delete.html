{% extends "shop/base.html" %}
{% block title %}Delete Product — Corner{% endblock %}

{% block content %}
<div class="container section">
  <div style="max-width:480px;margin:0 auto;text-align:center">
    <div style="font-size:64px;margin-bottom:24px">⚠️</div>
    <div style="font-family:var(--font-d);font-size:36px;letter-spacing:2px;margin-bottom:12px">DELETE PRODUCT</div>
    <p style="color:var(--text-2);font-size:15px;margin-bottom:32px">
      Are you sure you want to delete <strong style="color:var(--text)">{{ object.name }}</strong>?
      This action cannot be undone.
    </p>
    <form method="POST" style="display:flex;gap:12px;justify-content:center">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger btn-lg">Yes, Delete</button>
      <a href="{% url 'home' %}" class="btn btn-ghost btn-lg">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
