{% extends "shop/base.html" %}
{% block title %}Register — Corner{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="width:100%;max-width:420px">

    <div style="text-align:center;margin-bottom:40px">
      <div style="font-family:var(--font-d);font-size:36px;letter-spacing:4px;color:var(--accent);margin-bottom:8px">CORNER</div>
      <div style="font-size:14px;color:var(--text-2)">Create your account</div>
    </div>

    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:40px">
      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-control" type="text" name="name" placeholder="John Doe" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="pass1" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-control" type="password" name="pass2" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px">Create Account</button>
      </form>

      <div style="text-align:center;margin-top:24px;font-size:14px;color:var(--text-2)">
        Already have an account?
        <a href="{% url 'login' %}" style="color:var(--accent);font-weight:600;margin-right:4px">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
